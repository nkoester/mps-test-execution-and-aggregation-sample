name: MPS test report
description: >-
  Aggregates MPS test results (interpreter tests, generated Java tests, model checker) from JUnit XML
  artifacts into a check run and a job summary with links that open the failing nodes in MPS.
  Build tool agnostic: it only consumes artifacts named <artifact-prefix><category>-<name>.
  The overview table of the job summary links each run's artifact and one combined artifact of all results; reading the
  artifact URLs needs 'actions: read' (without it the summary has no download links).

inputs:
  artifact-prefix:
    description: >-
      Prefix of the result artifacts (must not be empty); the remainder is <category>-<name>: the first segment
      is the category (interpreted, generated and modelcheck have display names, others are shown as they are),
      the rest the run name
    default: test-results-
  result-files:
    description: >-
      File name patterns of the JUnit XML result files in the artifacts (one per line or comma separated,
      matched in any subdirectory); the aggregate TESTS-TestSuites.xml is excluded by the defaults
    default: |
      InterpreterTestSuite*.xml
      TEST-*.xml
  show-passed:
    description: >-
      List passed tests in the summary ('true'): runs with fewer than 5 tests in one table, larger ones with
      the passed tests folded. With 'false' passed tests are only counted
    default: 'false'
  expand-successful-sections:
    description: >-
      The runs of every category are foldable; categories with failures or errors start unfolded. 'true' also
      unfolds the successful categories, by default they start folded
    default: 'false'
  check-name:
    description: Name of the check run
    default: Test results
  mps-url:
    description: Base URL of the MPS HTTP support plugin used for node links
    default: http://127.0.0.1:63320
  append-markdown:
    description: Optional markdown file appended to the job summary after the test results
    default: ''
  pr-comment:
    description: >-
      On pull_request events, post the test report (without append-markdown) as a PR comment and update that
      comment on later runs (one comment per workflow and check-name). Needs 'pull-requests: write'; PRs from
      forks are skipped (read-only token). Falls back to the overview table if the report exceeds the comment limit
    default: 'false'
  create-check-run:
    description: >-
      Publish the results as a check run, which fails if any test failed. With 'false' the failures are only
      annotated, so the build status depends on the test jobs alone
    default: 'true'
  run-order:
    description: >-
      Optional order of the runs (<name> part of the artifact names, one per line) within their category.
      Listed runs come first in this order, the others follow by name
    default: ''
  aggregate-report:
    description: >-
      Add the classic Ant JUnit report (junitreport) of all runs to the combined artifact: index.html at its top
      level plus TESTS-TestSuites.xml. 'frames' (default), 'noframes' or 'none'; needs ant on the runner
      (preinstalled on GitHub-hosted Linux runners), otherwise only a warning
    default: frames
  upload-combined-artifact:
    description: Upload all downloaded results as one artifact, linked at the top of the summary
    default: 'true'
  combined-artifact:
    description: >-
      Name of the combined artifact; empty derives it from the prefix: all-<artifact-prefix without trailing '-'>,
      e.g. all-test-results. Must not start with artifact-prefix (the download would pick it up as a run)
    default: ''
  retention-days:
    description: Retention of the combined artifact in days; empty uses the repository default
    default: ''

runs:
  using: composite
  steps:
    - name: Check inputs
      id: config
      shell: bash
      env:
        PREFIX: ${{ inputs.artifact-prefix }}
        COMBINED: ${{ inputs.combined-artifact }}
      run: |
        if [[ -z "$PREFIX" ]]; then
          echo "::error::artifact-prefix must not be empty, it would match every artifact of the run"
          exit 1
        fi
        combined=${COMBINED:-all-${PREFIX%-}}
        if [[ "$combined" == "$PREFIX"* ]]; then
          echo "::error::combined-artifact '$combined' must not start with artifact-prefix '$PREFIX'"
          exit 1
        fi
        echo "combined-artifact=$combined" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@v8
      with:
        pattern: ${{ inputs.artifact-prefix }}*
        path: ${{ runner.temp }}/mps-test-report

    # action-junit-report treats each report_paths line as a separate report (and check run), so the result
    # files are collected into one directory for a single glob; the relative path in the file name keeps files
    # of different artifacts apart
    - name: Collect result files
      shell: bash
      env:
        RESULTS: ${{ runner.temp }}/mps-test-report
        JUNIT: ${{ runner.temp }}/mps-test-report-junit
        RESULT_FILES: ${{ inputs.result-files }}
      run: |
        mkdir -p "$JUNIT"
        names=()
        while IFS= read -r pattern; do
          pattern=${pattern#"${pattern%%[![:space:]]*}"}
          pattern=${pattern%"${pattern##*[![:space:]]}"}
          [[ -n "$pattern" ]] && names+=(${names:+-o} -name "$pattern")
        done < <(tr ',' '\n' <<< "$RESULT_FILES")
        if (( ${#names[@]} == 0 )); then
          echo "::error::result-files must name at least one pattern"
          exit 1
        fi
        if [[ -d "$RESULTS" ]]; then
          find "$RESULTS" -type f \( "${names[@]}" \) -print0 |
            while IFS= read -r -d '' f; do
              rel=${f#"$RESULTS"/}
              cp "$f" "$JUNIT/${rel//\//__}"
            done
        fi

    # Classic Ant JUnit report (junitreport = XMLResultAggregator) over all result files: index.html, frames and
    # TESTS-TestSuites.xml at the top level of the combined artifact. Prepared copies: junitreport needs one
    # <testsuite> root per file and takes the package from the suite name. Without ant only a warning.
    - name: Aggregate report
      if: ${{ inputs.aggregate-report != 'none' && inputs.upload-combined-artifact == 'true' }}
      shell: bash
      env:
        RESULTS: ${{ runner.temp }}/mps-test-report
        JUNIT: ${{ runner.temp }}/mps-test-report-junit
        PREPARED: ${{ runner.temp }}/mps-test-report-aggregate
        FORMAT: ${{ inputs.aggregate-report }}
      run: |
        if [[ "$FORMAT" != frames && "$FORMAT" != noframes ]]; then
          echo "::error::aggregate-report must be frames, noframes or none, not '$FORMAT'"
          exit 1
        fi
        if ! command -v ant > /dev/null; then
          echo "::warning::ant not found on the runner; the combined artifact has no aggregated report"
          exit 0
        fi
        mkdir -p "$RESULTS"
        python3 -I "$GITHUB_ACTION_PATH/prepare_aggregate.py" "$JUNIT" "$PREPARED/input"
        cat > "$PREPARED/build.xml" <<'EOF'
        <project name="aggregate-report" default="report">
          <target name="report">
            <junitreport todir="${results}">
              <fileset dir="${input}" includes="*.xml"/>
              <report format="${format}" todir="${results}"/>
            </junitreport>
          </target>
        </project>
        EOF
        ant -q -f "$PREPARED/build.xml" -Dinput="$PREPARED/input" -Dresults="$RESULTS" -Dformat="$FORMAT" ||
          echo "::warning::the aggregated report could not be created (ant junitreport failed)"

    - name: Upload combined results
      if: ${{ inputs.upload-combined-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.config.outputs.combined-artifact }}
        path: ${{ runner.temp }}/mps-test-report/
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    # download URLs of all artifacts of this run (incl. the combined one), newest per name; without
    # 'actions: read' the API call fails and the summary is written without download links
    - name: Resolve artifact links
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        LINKS: ${{ runner.temp }}/mps-test-report-links.json
      run: |
        gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
          --jq '.artifacts[] | [.name, (.id | tostring), .created_at] | @tsv' > "$LINKS.tsv" ||
          echo "::warning::Cannot list the artifacts of this run (needs 'actions: read'); no download links"
        python3 -I - "$LINKS.tsv" "$LINKS" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" <<'EOF'
        import json
        import sys
        from pathlib import Path

        source, target, run_url = sys.argv[1:]
        rows = sorted(line.split("\t") for line in Path(source).read_text().splitlines() if line.count("\t") == 2)
        # sorted by name, then created_at: the newest artifact of a name (e.g. after a re-run) wins
        links = {name: f"{run_url}/artifacts/{artifact_id}" for name, artifact_id, _ in rows}
        Path(target).write_text(json.dumps(links))
        EOF

    # Check run + annotations; pass/fail is decided by the test jobs
    - name: Publish check run
      uses: mikepenz/action-junit-report@v6
      with:
        check_name: ${{ inputs.check-name }}
        report_paths: ${{ runner.temp }}/mps-test-report-junit/*.xml
        include_passed: true
        detailed_summary: true
        job_summary: false
        fail_on_failure: false
        require_tests: false
        # PRs from forks get a read-only token and cannot create check runs
        annotate_only: ${{ inputs.create-check-run != 'true' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

    - name: Write job summary
      shell: bash
      env:
        RESULTS: ${{ runner.temp }}/mps-test-report
        PREFIX: ${{ inputs.artifact-prefix }}
        MPS_URL: ${{ inputs.mps-url }}
        APPEND: ${{ inputs.append-markdown }}
        RUN_ORDER: ${{ inputs.run-order }}
        LINKS: ${{ runner.temp }}/mps-test-report-links.json
        COMBINED: ${{ inputs.upload-combined-artifact == 'true' && steps.config.outputs.combined-artifact || '' }}
        RESULT_FILES: ${{ inputs.result-files }}
        SHOW_PASSED: ${{ inputs.show-passed }}
        EXPAND_SUCCESSFUL: ${{ inputs.expand-successful-sections }}
        SUMMARY: ${{ runner.temp }}/mps-test-report-summary.md
      run: |
        # also kept as a file for the pull request comment
        python3 -I "$GITHUB_ACTION_PATH/test_summary.py" "$RESULTS" --prefix "$PREFIX" --mps-url "$MPS_URL" \
          --run-order "$RUN_ORDER" --result-files "$RESULT_FILES" --links "$LINKS" --combined-artifact "$COMBINED" \
          $([[ "$SHOW_PASSED" == true ]] && echo --show-passed) \
          $([[ "$EXPAND_SUCCESSFUL" == true ]] && echo --expand-successful-sections) > "$SUMMARY"
        {
          cat "$SUMMARY"
          if [[ -n "$APPEND" && -f "$APPEND" ]]; then
            echo
            cat "$APPEND"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on pull request
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUMMARY: ${{ runner.temp }}/mps-test-report-summary.md
        MARKER: '<!-- mps-test-report: ${{ github.workflow }} / ${{ inputs.check-name }} -->'
        PR: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        WORKFLOW: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash "$GITHUB_ACTION_PATH/pr_comment.sh"
