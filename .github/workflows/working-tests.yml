name: MPS tests (working)

# Only the runs that are expected to pass: a sample of a fully working (green) build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# granted for the report job of mps-tests.yml (artifact links, check run, PR comment), see there
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/mps-tests.yml
    with:
      include-demos: false
      create-check-run: true
      pr-comment: true
