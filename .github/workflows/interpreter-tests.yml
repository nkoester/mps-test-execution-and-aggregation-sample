name: MPS tests (incl. failing demos)

# All runs including the demos that fail on purpose, to show failures in the report; this run is red by design.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# granted for the report job of mps-tests.yml (artifact links, check run, PR comment), see there
permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/mps-tests.yml
    with:
      include-demos: true
      # red by design: the check run and the PR comment show the demo failures
      create-check-run: true
      pr-comment: true
