name: MPS tests (incl. failing demos)

# All runs including the demos that fail on purpose, to show failures in the report; this run is red by design.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# actions: read lets the report action resolve the artifact download links
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/mps-tests.yml
    with:
      include-demos: true
